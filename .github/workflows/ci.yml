# Gerado por estrutura.sh a partir do README. Repete no GitHub os comandos locais.
# Ferramentas de linguagens sem passo de preparo abaixo: instale-as aqui.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: lint (go)
        run: |
          go vet ./... && GOOS=windows go vet ./...
      - name: testar (go)
        run: |
          go test -race ./...
      - name: auditar (govulncheck)
        run: |
          govulncheck ./...
      - name: dependencias-sem-uso (go)
        run: |
          go mod tidy -diff
